services:
  postgres:
    image: postgres:17-alpine
    container_name: smart-locker-postgres
    environment:
      POSTGRES_DB: smartlocker
      POSTGRES_USER: smartlocker
      POSTGRES_PASSWORD: smartlocker
    ports:
      - "5432:5432"
    volumes:
      - smart_locker_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U smartlocker -d smartlocker"]
      interval: 5s
      timeout: 5s
      retries: 10

  app:
    build: .
    container_name: smart-locker-app
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/smartlocker
      SPRING_DATASOURCE_USERNAME: smartlocker
      SPRING_DATASOURCE_PASSWORD: smartlocker
    ports:
      - "8080:8080"

volumes:
  smart_locker_pgdata:
