spring.application.name=smart-locker

spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/smartlocker}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:smartlocker}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:smartlocker}

spring.jpa.open-in-view=false
spring.jpa.hibernate.ddl-auto=validate

spring.flyway.enabled=true
